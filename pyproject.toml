[project]
name = "fake_certificate_detector"
version = "0.1.0"
description = "A beginner-friendly Python prototype that detects fake internship certificates using Error Level Analysis (ELA) and a Convolutional Neural Network (CNN)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
    "flask-login>=0.6.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.15",
]

[project.scripts]
certificate-detector = "main:main"
