<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake Certificate Detector</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 680px);
        background: #ffffff;
        border: 1px solid #d7dde5;
        border-radius: 8px;
        padding: 32px;
        box-shadow: 0 18px 45px rgba(24, 39, 75, 0.08);
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        line-height: 1.2;
      }

      p,
      .field-label {
        color: #536273;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .field-label {
        display: block;
        font-weight: 700;
        margin-bottom: -8px;
      }

      input[type="file"] {
        border: 1px dashed #9aa8b6;
        border-radius: 8px;
        padding: 16px;
        background: #fbfcfd;
      }

      button {
        justify-self: start;
        border: 0;
        border-radius: 6px;
        background: #176b87;
        color: #ffffff;
        padding: 11px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .result,
      .error {
        margin-top: 24px;
        border-radius: 8px;
        padding: 16px;
      }

      .result {
        background: #edf7f3;
        border: 1px solid #a7d7c5;
      }

      .error {
        background: #fff1f0;
        border: 1px solid #ffb3ad;
        color: #8a1f11;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fake Certificate Detector</h1>

      <form method="post" enctype="multipart/form-data">
        <label class="field-label" for="certificate">Certificate image</label>
        <input id="certificate" type="file" name="certificate" accept="image/*" required>
        <button type="submit">Analyze Certificate</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      {% if result %}
        <div class="result">
          <strong>{{ result.label }}</strong>
          <p>Confidence: {{ "%.2f"|format(result.confidence * 100) }}%</p>
          <p>Fake probability: {{ "%.2f"|format(result.fake_probability * 100) }}%</p>
        </div>
      {% endif %}
    </main>
  </body>
</html>
